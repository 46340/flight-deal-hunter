name: Probe Google Flights

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = 10 raw queries; smoke = real pipeline on config/searches.smoke.json"
        type: choice
        options: [probe, smoke]
        default: probe
      out_date:
        description: "Probe outbound date (YYYY-MM-DD), blank for 32 days from today"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        if: inputs.mode == 'probe'
        env:
          OUT_DATE: ${{ inputs.out_date }}
        run: python scripts/probe_google.py --save-dir probe-out ${OUT_DATE:+--out-date "$OUT_DATE"}
      - name: Smoke run
        if: inputs.mode == 'smoke'
        run: |
          python -m scraper.run --config config/searches.smoke.json --data-dir probe-out
          cat probe-out/runs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe-out/
          retention-days: 7
